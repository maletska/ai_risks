<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10254d">
<title>MIND THE ART GAP · Το εισιτήριο του ταξιδιού</title>
<style>
  :root {
    --navy: #102653; --navy2: #0b1c3d; --ink: #f7f1e4; --muted: #c9d3e6;
    --gold: #f3c34e; --teal: #58b9b2; --cream: #fff8e9;
    --fear: #ff8a7a; --crit: #5fd3a8; --trust: #7db8ff;
    --line: rgba(243,195,78,.35); --glass: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1c3d; overflow: hidden; }
  body { color: var(--ink); font-family: Arial, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.4; }
  /* Σταθερή σκηνή 900×675 (4:3, όσο η σελίδα Landscape του Book Creator) που κλιμακώνεται για να χωρέσει */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .scene { width: 900px; height: 675px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0b1c3d, #142d5b 60%, #0b1d40); transform-origin: center; }
  [hidden] { display: none !important; }
  h1, h2, .serif { font-family: Georgia, "Times New Roman", serif; }
  h1 { font-size: 2.3rem; line-height: 1.08; margin: 6px 0 12px; }
  h2 { font-size: 1.35rem; line-height: 1.2; margin: 4px 0 10px; }
  h1:focus, h2:focus, .q:focus { outline: none; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  .topline { position: absolute; top: 0; left: 0; right: 0; height: 38px; padding: 0 22px; display: flex; justify-content: space-between; align-items: center;
    color: var(--gold); font: 700 11px/1 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.15); }
  .star { font-size: 16px; text-shadow: 0 0 12px var(--gold); margin-right: 6px; }
  section { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; }
  .kicker { color: var(--gold); font: 700 11px/1.4 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }

  /* 1. Αρχή: φωτογραφία αριστερά, κείμενο δεξιά */
  #s-start { display: grid; grid-template-columns: 340px 1fr; }
  .visual { position: relative; background: #17375e; overflow: hidden; }
  .visual img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
  .visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,24,54,.8), transparent 50%); }
  .visual-caption { position: absolute; z-index: 1; left: 18px; right: 18px; bottom: 16px; color: #fff5d9;
    font: 700 10px/1.5 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .intro { padding: 26px 30px 22px; display: flex; flex-direction: column; justify-content: center; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fields.one { grid-template-columns: 1fr; }

  /* Γραμμή μετρό */
  .spectrum { margin: 10px 0 4px; }
  .rail { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--fear), var(--crit) 50%, var(--trust)); }
  .stops { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
  .stops span:nth-child(1) { color: var(--fear); }
  .stops span:nth-child(2) { color: var(--crit); }
  .stops span:nth-child(3) { color: var(--trust); }
  .train { position: absolute; top: 50%; width: 34px; height: 34px; margin-left: -17px; transform: translateY(-50%);
    background: var(--cream); border: 3px solid var(--navy); border-radius: 50%; display: grid; place-items: center; font-size: 17px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); transition: left 1.2s cubic-bezier(.2,.8,.2,1); }
  .train.prev { border-style: dashed; opacity: .6; }

  /* Κουμπιά & φόρμα */
  button { font: inherit; font-weight: 700; border-radius: 999px; border: 2px solid transparent; padding: 10px 18px; min-height: 46px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn { font-size: 1rem; color: #14264a; background: linear-gradient(135deg, #f7d36c, #e6aa2e); box-shadow: 0 7px 22px rgba(231,169,45,.25); white-space: nowrap; }
  .btn.sec { background: transparent; color: var(--gold); border-color: rgba(243,195,78,.6); box-shadow: none; }
  button:disabled { opacity: .4; cursor: default; }
  .nav { display: flex; gap: 10px; justify-content: space-between; }
  .nav button { flex: 1; }
  label.field { display: block; margin: 10px 0 5px; color: var(--gold); font: 700 10px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(243,195,78,.45); background: rgba(5,18,43,.45); color: #fff; }
  input.code { font-family: ui-monospace, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
  .error { color: #ffd88b; font-size: .85rem; min-height: 1.2em; margin: 6px 0 4px; }

  /* 2. Δήλωση */
  #s-q { padding: 26px 40px; display: flex; flex-direction: column; justify-content: center; }
  .prow { display: flex; justify-content: space-between; color: var(--gold); font: 700 11px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 8px; }
  .progress { height: 7px; background: rgba(255,255,255,.14); border-radius: 9px; overflow: hidden; margin-bottom: 26px; }
  .progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); transition: width .25s; }
  .q { font-size: 1.9rem; line-height: 1.25; margin: 0 0 6px; }
  .ask { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 26px; }
  .scale button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; min-height: 108px;
    background: var(--glass); border-color: rgba(255,255,255,.2); color: var(--ink); font-size: 1rem; padding: 10px 6px; }
  .scale button .emo { font-size: 2rem; line-height: 1; }
  .scale button.on { border-color: var(--gold); background: rgba(243,195,78,.18); color: #fff; }
  #s-q .nav { max-width: 420px; margin: 0 auto; width: 100%; }

  /* 3. Εισιτήριο: δύο στήλες */
  #s-ticket { padding: 18px 26px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-content: start; }
  .ticket { background: linear-gradient(135deg, #fff8e9, #ffe9a0); color: var(--navy); border-radius: 14px; overflow: hidden; margin: 4px 0 10px; animation: print .7s ease; }
  .ticket .main { padding: 12px 16px; }
  .ticket .brand { font-size: .68rem; font-weight: 800; letter-spacing: 2px; color: var(--navy); }
  .ticket .who { font-size: .82rem; color: #5b6380; margin: 2px 0 8px; }
  .ticket .lean { font-size: 1.05rem; font-weight: 700; line-height: 1.3; margin: 0; }
  .ticket .ask-q { margin: 8px 0 0; font-size: .92rem; }
  .ticket .ask-q b { display: block; font-size: .66rem; letter-spacing: 1.5px; color: #5b6380; margin-bottom: 1px; }
  .ticket .stub { border-top: 3px dashed var(--navy); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #ffffff66; }
  .ticket .code { font-family: ui-monospace, Consolas, monospace; font-size: 1.45rem; font-weight: 700; letter-spacing: .12em; }
  .ticket .code small { display: block; font-size: .62rem; letter-spacing: 1.5px; color: #5b6380; font-family: Arial, sans-serif; }
  .ticket .date { font-family: ui-monospace, Consolas, monospace; font-size: .82rem; }
  @keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

  .bars { display: grid; gap: 8px; margin: 2px 0 4px; }
  .barline { display: flex; justify-content: space-between; align-items: baseline; font-size: .88rem; margin-bottom: 3px; }
  .track { height: 9px; border-radius: 20px; background: rgba(255,255,255,.14); overflow: hidden; }
  .fill { height: 100%; border-radius: 20px; width: 0; transition: width 1s ease; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
  .chips li { display: flex; align-items: center; gap: 6px; font-size: .85rem; padding: 5px 10px; border-radius: 20px; background: var(--glass); border: 1px solid rgba(243,195,78,.4); }
  .dot { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--gold); background: var(--navy); }
  .box { border-left: 3px solid var(--gold); background: rgba(243,195,78,.1); border-radius: 0 10px 10px 0; padding: 8px 12px; margin: 10px 0; font-size: .9rem; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; padding: 10px 8px; font-size: .92rem; }
  .footerline { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--gold);
    font: 700 9.5px Arial, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
  .live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* Εκτύπωση: λευκή σελίδα, σκούρα γράμματα, έντονα χρώματα σε κάρτα/γραμμή/μπάρες */
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    html, body { background: #fff !important; color: #102653; overflow: visible; height: auto; }
    #stage { position: static; display: block; }
    .scene { transform: none !important; width: auto; height: auto; overflow: visible; background: none !important; }
    .topline, .no-print, .visual, .live { display: none !important; }
    section { position: static; }
    #s-start { display: block; padding: 0; }
    #s-ticket { padding: 0; gap: 28px; }
    .scene * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    h1, h2, p, .q, .ask, .prow, .barline, .barline b, .chips li, .stops span { color: #102653 !important; }
    .kicker, .footerline { color: #8a6410 !important; }
    .muted { color: #46516b !important; }
    .ticket { background: #fff3c4 !important; border: 2px solid #102653; animation: none !important; }
    .ticket .stub { background: #fffbea !important; }
    .rail { background: linear-gradient(90deg, #c0392b, #1e8a5a 50%, #2d6cdf) !important; }
    .train { background: #fff !important; border-color: #102653 !important; box-shadow: none !important; transition: none !important; }
    .track { background: #dde3ee !important; }
    .fill { transition: none !important; }
    .fill[data-k="fear"] { background: #c0392b !important; }
    .fill[data-k="crit"] { background: #1e8a5a !important; }
    .fill[data-k="trust"] { background: #2d6cdf !important; }
    .chips li { background: #fff !important; border-color: #c9a227 !important; }
    .dot { background: #c9a227 !important; border-color: #8a6410 !important; }
    .box { background: #fff8e1 !important; border-left-color: #c9a227 !important; color: #102653 !important; }
    .box strong { color: #102653; }
    input[type=text] { background: #fff !important; color: #102653 !important; border-color: #c9a227 !important; }
    button { display: none !important; }
  }
</style>
</head>

      <ul class="chips" id="stations"></ul>
      <div class="box" id="discuss"></div>
      <div class="actions no-print">
        <button class="btn" id="dl" type="button">⬇️ Αποθήκευση</button>
        <button class="btn sec" id="print" type="button">🖨️ Εκτύπωση</button>
        <button class="btn sec" id="again" type="button">🔄 Ξανά</button>
      </div>
      <div class="footerline"><span>Χωρίς φόβο · χωρίς τυφλή εμπιστοσύνη</span><span>Προσοχή στο κενό!</span></div>
    </div>
  </section>

  <div aria-live="polite" id="live" class="live"></div>
</div></div>

<script>
(() => {
  const MODE = "end"; // "start" = αφετηρία (Στάση 00) · "end" = άφιξη (Επίλογος)
  const END = MODE === "end";

  // Κλιμάκωση της σκηνής 900×675 ώστε να χωρά στο πλαίσιο (iframe/παράθυρο), χωρίς αναδιάταξη
  const scene = document.getElementById("scene");
  if (scene) { const fit = () => { const s = Math.min(window.innerWidth / 900, window.innerHeight / 675); scene.style.transform = `scale(${s})`; }; window.addEventListener("resize", fit); fit(); }

  // axis: trust = «τυφλή εμπιστοσύνη», fear = «φόβος», crit = «κριτική σκέψη» (η συμφωνία είναι θετική)
  const Q = [
    { text: "Δεν με νοιάζει πώς αποφασίζει η ΤΝ, αρκεί να δουλεύει.", axis: "trust", ch: "Κεφ. 1 · Το Μαύρο Κουτί" },
    { text: "Η ΤΝ είναι αντικειμενική, γιατί βασίζεται σε μαθηματικά.", axis: "trust", ch: "Κεφ. 2 · Αλγοριθμική Μεροληψία" },
    { text: "Αν μια εικόνα μοιάζει αληθινή, μάλλον είναι αληθινή.", axis: "trust", ch: "Κεφ. 3 · Deepfakes" },
    { text: "Οι εφαρμογές επηρεάζουν τι βλέπω και τι πιστεύω.", axis: "crit", ch: "Κεφ. 4 · Η Φούσκα Φίλτρου" },
    { text: "Όταν το chatbot απαντά με σιγουριά, έχει δίκιο.", axis: "trust", ch: "Κεφ. 5 · Οι Παραισθήσεις της Μηχανής" },
    { text: "Ένα έργο στο ίντερνετ ανήκει ακόμη στον δημιουργό του.", axis: "crit", ch: "Κεφ. 6 · Δεδομένα και Δικαιώματα" },
    { text: "Η ΤΝ θα αντικαταστήσει τους καλλιτέχνες.", axis: "fear", ch: "Επίλογος · Γεφυρώνοντας το Κενό" },
    { text: "Καλύτερα να μη χρησιμοποιώ καθόλου ΤΝ.", axis: "fear", ch: "Επίλογος · Γεφυρώνοντας το Κενό" }
  ];
  const SCALE = [
    { v: 0, emo: "🙅", t: "Καθόλου" },
    { v: 1, emo: "🤨", t: "Λίγο" },
    { v: 2, emo: "🤔", t: "Έτσι κι έτσι" },
    { v: 3, emo: "🙂", t: "Αρκετά" },
    { v: 4, emo: "💯", t: "Πολύ" }
  ];
  // Περιγραφή των απαντήσεων (όχι του προσώπου) + ερώτηση-συντροφιά (διαφορετική στην αφετηρία και στην άφιξη)
  const LEAN = {
    trust:  { lean: "Οι απαντήσεις σου κλίνουν προς την εμπιστοσύνη στην ΤΝ.", label: "κοντά στην εμπιστοσύνη",
              q: "Πότε αξίζει να ελέγχω αυτό που μου λέει η μηχανή;", qEnd: "Τι θα ελέγχω από εδώ και πέρα, πριν εμπιστευτώ τη μηχανή;" },
    fear:   { lean: "Οι απαντήσεις σου κλίνουν προς την επιφύλαξη απέναντι στην ΤΝ.", label: "κοντά στην επιφύλαξη",
              q: "Τι μπορώ να κάνω εγώ με την ΤΝ, αντί να την αποφεύγω;", qEnd: "Τι θα δοκιμάσω με την ΤΝ, με δικούς μου όρους;" },
    center: { lean: "Οι απαντήσεις σου βρίσκονται κοντά στη μέση της γραμμής.", label: "κοντά στη μέση",
              q: "Πώς στηρίζω αυτή την ισορροπία με επιχειρήματα;", qEnd: "Ποιο επιχείρημα από το ταξίδι στηρίζει την ισορροπία μου;" },
    both:   { lean: "Οι απαντήσεις σου δείχνουν και εμπιστοσύνη και επιφύλαξη.", label: "και στα δύο άκρα",
              q: "Πού αξίζει εμπιστοσύνη και πού προσοχή;", qEnd: "Πού τελικά αξίζει εμπιστοσύνη και πού προσοχή;" }
  };
  const BARS = [["fear", "😨 Φόβος", "#ff8a7a"], ["crit", "🧭 Κριτική σκέψη", "#5fd3a8"], ["trust", "🙈 Τυφλή εμπιστοσύνη", "#7db8ff"]];

  // Κείμενα ανά έκδοση
  const T = END ? {
    title: "MIND THE ART GAP · Δελτίο εξόδου · Επίλογος",
    tl: "Δελτίο εξόδου · Επίλογος",
    kicker: "Δελτίο εξόδου · στο τέλος του ταξιδιού",
    h1: "Πού έφτασες στο ταξίδι;",
    lead: "Απάντησε ξανά στις 8 δηλώσεις. Γράψε τον κωδικό του εισιτηρίου σου για να δεις πόσο μετακινήθηκε το τρένο σου.",
    small: "Οι ίδιες 8 δηλώσεις · 2 λεπτά · χωρίς σωστές και λάθος απαντήσεις.",
    go: "Έναρξη",
    tkKicker: "MIND THE ART GAP · Δελτίο εξόδου",
    h2: "📝 Δελτίο εξόδου",
    brand: "ΕΠΙΛΟΓΟΣ · ΕΞΟΔΟΣ",
    qLabel: "ΕΡΩΤΗΣΗ ΓΙΑ ΜΕΤΑ ΤΟ ΤΑΞΙΔΙ",
    codeLabel: "ΚΩΔΙΚΟΣ ΕΞΟΔΟΥ",
    last: "Δελτίο εξόδου 📝",
    png: "Δελτίο εξόδου",
    bars: "Η θέση σου στο τέλος",
    stTitle: "📍 Στάσεις για δεύτερη ματιά",
    stTitleDiff: "🔁 Τι άλλαξε από την αφετηρία",
    discuss: "<strong>💬 Στην τάξη:</strong> Τι άλλαξε στον τρόπο που σκέφτεσαι; Ποια στάση το προκάλεσε;",
    keynote: "<strong>🔑 Κωδικός εξόδου.</strong> Κράτησέ τον μαζί με τον κωδικό του εισιτηρίου σου: οι δύο μαζί είναι όλη η διαδρομή σου."
  } : {
    title: "MIND THE ART GAP · Το εισιτήριο του ταξιδιού · Αφετηρία",
    tl: "Το εισιτήριο του ταξιδιού · Στάση 00",
    kicker: "Το εισιτήριό σου · πριν από την αναχώρηση",
    h1: "Πού βρίσκεσαι στο ταξίδι;",
    lead: "Πώς βλέπεις σήμερα την Τεχνητή Νοημοσύνη; Ο στόχος είναι η μέση της γραμμής.",
    small: "8 δηλώσεις · 2 λεπτά · χωρίς σωστές και λάθος απαντήσεις.",
    go: "Επιβιβάζομαι στο ταξίδι →",
    tkKicker: "MIND THE ART GAP · Κάρτα επιβίβασης",
    h2: "🎫 Το εισιτήριό σου",
    brand: "ΣΤΑΣΗ 00 · ΑΝΑΧΩΡΗΣΗ",
    qLabel: "ΕΡΩΤΗΣΗ ΓΙΑ ΤΟ ΤΑΞΙΔΙ",
    codeLabel: "ΚΩΔΙΚΟΣ ΕΙΣΙΤΗΡΙΟΥ",
    last: "Εισιτήριο 🎫",
    png: "Το εισιτήριο του ταξιδιού",
    bars: "Η αφετηρία σου",
    stTitle: "📍 Στάσεις για σένα",
    stTitleDiff: "",
    discuss: "<strong>💬 Στην τάξη:</strong> Ποια δήλωση σε δυσκόλεψε; Γιατί;",
    keynote: "<strong>🔑 Κράτα τον κωδικό σου.</strong> Στον <strong>Επίλογο</strong> θα τον γράψεις για να δεις αν μετακινήθηκε το τρένο σου. Δουλεύει σε οποιαδήποτε συσκευή."
  };

  // ---- Κωδικός εισιτηρίου: 8 απαντήσεις (0–4) -> 4 χαρακτήρες + 1 ελέγχου. Ίδιος σε όλες τις εκδόσεις. Τίποτα δεν αποθηκεύεται στη συσκευή.
  const AB = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; // χωρίς 0/O, 1/I/L
  function encode(ans) {
    let n = 0; for (let k = ans.length - 1; k >= 0; k--) n = n * 5 + ans[k];
    let s = ""; for (let k = 0; k < 4; k++) { s = AB[n % 31] + s; n = Math.floor(n / 31); }
    let c = 0; for (let k = 0; k < 4; k++) c += (k + 3) * AB.indexOf(s[k]);
    return s + "-" + AB[c % 31];
  }
  function decode(str) {
    const s = String(str).toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1");
    if (s.length !== 5 || [...s].some(ch => !AB.includes(ch))) return null;
    let c = 0; for (let k = 0; k < 4; k++) c += (k + 3) * AB.indexOf(s[k]);
    if (AB[c % 31] !== s[4]) return null;
    let n = 0; for (let k = 0; k < 4; k++) n = n * 31 + AB.indexOf(s[k]);
    if (n >= 390625) return null;
    const ans = []; for (let k = 0; k < 8; k++) { ans.push(n % 5); n = Math.floor(n / 5); }
    return ans;
  }

  const $ = id => document.getElementById(id);
  const sections = ["s-start", "s-q", "s-ticket"];
  let answers = new Array(Q.length).fill(null);
  let i = 0, result = null, timer = null, oldAnswers = null;

  // Στατικά κείμενα
  document.title = T.title;
  $("tl-right").textContent = T.tl;
  $("st-kicker").textContent = T.kicker;
  $("t-start").textContent = T.h1;
  $("st-lead").textContent = T.lead;
  $("go").textContent = T.go;
  $("st-small").textContent = T.small;
  $("tk-kicker").textContent = T.tkKicker;
  $("t-ticket").textContent = T.h2;
  $("tk-brand").textContent = T.brand;
  $("tk-qlabel").textContent = T.qLabel;
  $("tk-codelabel").textContent = T.codeLabel;
  $("bars-title").textContent = T.bars;
  $("discuss").innerHTML = T.discuss;
  $("keynote").innerHTML = T.keynote;
  if (!END) { $("oldcode-wrap").hidden = true; $("fields").classList.add("one"); }

  function show(id) { sections.forEach(s => $(s).hidden = s !== id); const v = $("visual"); if (v) v.style.display = id === "s-start" ? "" : "none"; window.scrollTo(0, 0); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function compute(ans) {
    const mean = ax => { const v = Q.map((q, k) => q.axis === ax ? ans[k] : null).filter(x => x !== null); return v.reduce((a, b) => a + b, 0) / (v.length * 4); };
    const trust = mean("trust"), fear = mean("fear"), crit = mean("crit");
    let lean;
    if (trust >= 0.6 && fear >= 0.6) lean = "both";
    else if (trust - fear >= 0.3) lean = "trust";
    else if (fear - trust >= 0.3) lean = "fear";
    else lean = "center";
    const pos = Math.max(4, Math.min(96, 50 + (trust - fear) * 50));
    const hot = [];
    Q.forEach((q, k) => {
      const risky = q.axis === "crit" ? ans[k] <= 1 : ans[k] >= 3;
      if (risky && !hot.some(h => h.ch === q.ch)) hot.push(q);
    });
    return { trust, fear, crit, lean, pos, hot };
  }

  function renderQ() {
    clearTimeout(timer);
    $("q-tag").textContent = `Δήλωση ${String(i + 1).padStart(2, "0")}`;
    $("q-count").textContent = `${i + 1} / ${Q.length}`;
    $("bar").style.width = ((i + 1) / Q.length * 100) + "%";
    $("q-text").textContent = `«${Q[i].text}»`;
    $("scale").innerHTML = SCALE.map(s => `
      <button type="button" data-v="${s.v}" class="${answers[i] === s.v ? "on" : ""}" aria-pressed="${answers[i] === s.v}">
        <span class="emo" aria-hidden="true">${s.emo}</span><span>${s.t}</span></button>`).join("");
    $("scale").querySelectorAll("button").forEach(b => b.addEventListener("click", () => pick(Number(b.dataset.v))));
    $("next").disabled = answers[i] === null;
    $("next").textContent = i === Q.length - 1 ? T.last : "Επόμενη →";
    $("q-text").focus();
  }
  function pick(v) {
    answers[i] = v;
    $("scale").querySelectorAll("button").forEach(b => { const on = Number(b.dataset.v) === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    $("next").disabled = false;
    clearTimeout(timer);
    timer = setTimeout(goNext, 350); // αυτόματη μετάβαση
  }
  function goNext() { if (answers[i] === null) return; if (i < Q.length - 1) { i++; renderQ(); } else showTicket(); }

  function showTicket() {
    clearTimeout(timer);
    result = compute(answers);
    const L = LEAN[result.lean];
    const nick = $("nick").value.trim();
    const date = new Date().toLocaleDateString("el-GR");
    result.nick = nick; result.date = date; result.code = encode(answers);

    show("s-ticket");
    $("tk-who").textContent = nick ? `Επιβάτης: ${nick}` : "Επιβάτης: ανώνυμος/η";
    $("tk-lean").textContent = L.lean;
    $("tk-q").textContent = `«${END ? L.qEnd : L.q}»`;
    $("tk-code").textContent = result.code;
    $("tk-date").textContent = date;

    $("pos-img").setAttribute("aria-label", `Η θέση σου στη γραμμή: ${L.label}`);
    $("train").style.left = "50%";
    setTimeout(() => { $("train").style.left = result.pos + "%"; }, 80);

    $("bars").innerHTML = BARS.map(([k, n, c]) => `
      <div><div class="barline"><span>${n}</span><b>${Math.round(result[k] * 100)}%</b></div><div class="track"><div class="fill" data-k="${k}" style="background:${c}"></div></div></div>`).join("");
    setTimeout(() => { $("bars").querySelectorAll(".fill").forEach(f => f.style.width = Math.round(result[f.dataset.k] * 100) + "%"); }, 80);

    // Σύγκριση με το πρώτο εισιτήριο (από τον κωδικό που έγραψε ο μαθητής)
    if (oldAnswers) {
      const old = compute(oldAnswers);
      $("train-prev").hidden = false;
      $("train-prev").style.left = old.pos + "%";
      const d = Math.abs(result.pos - 50) - Math.abs(old.pos - 50);
      let msg = `🚃 Το αχνό βαγόνι είναι η αφετηρία σου (${esc(encode(oldAnswers))}). `;
      if (d <= -8) msg += "Τώρα είσαι <strong>πιο κοντά στη μέση της γραμμής</strong>. 🎉";
      else if (d >= 8) msg += "Τώρα απομακρύνθηκες από τη μέση. Τι σε επηρέασε;";
      else msg += "Η θέση σου έμεινε περίπου ίδια. Τι άλλαξε στον τρόπο που σκέφτεσαι;";
      $("compare").innerHTML = msg; $("compare").hidden = false;
    } else { $("train-prev").hidden = true; $("compare").hidden = true; }

    // Δεξιά λίστα: στην άφιξη με κωδικό = τι άλλαξε ανά δήλωση· αλλιώς = στάσεις
    if (END && oldAnswers) {
      const diff = Q.map((q, k) => ({ k, a: oldAnswers[k], b: answers[k] })).filter(x => x.a !== x.b);
      $("st-title").textContent = T.stTitleDiff;
      $("st-note").hidden = diff.length > 0;
      $("st-note").textContent = "Ίδιες απαντήσεις με την αφετηρία. Τι σε έκανε να μείνεις σταθερός/ή;";
      $("stations").innerHTML = diff.map(x => `<li><span class="dot" aria-hidden="true"></span><span><strong>Δήλωση ${String(x.k + 1).padStart(2, "0")}</strong> · ${SCALE[x.a].emo} → ${SCALE[x.b].emo} <span class="muted">${esc(SCALE[x.b].t)}</span></span></li>`).join("");
    } else {
      const hot = result.hot, list = hot.length ? hot : [Q[0], Q[4]];
      $("st-title").textContent = T.stTitle;
      $("st-note").hidden = hot.length > 0;
      $("st-note").textContent = "Καμία δήλωση «κινδύνου». Ξεκίνα από εδώ:";
      $("stations").innerHTML = list.map(q => `<li><span class="dot" aria-hidden="true"></span><span><strong>${esc(q.ch)}</strong></span></li>`).join("");
    }

    $("live").textContent = `${T.h2}. ${L.lean} Κωδικός ${result.code}.`;
    $("t-ticket").focus();
  }

  // Αποθήκευση ως εικόνα PNG
  function downloadTicket() {
    const L = LEAN[result.lean];
    const W = 1000, H = 640, c = document.createElement("canvas");
    c.width = W; c.height = H; const x = c.getContext("2d");
    const F = "Arial, 'Segoe UI', sans-serif", S = "Georgia, 'Times New Roman', serif";
    x.fillStyle = "#102653"; x.fillRect(0, 0, W, H);
    x.strokeStyle = "#e9ba4a"; x.lineWidth = 4; x.strokeRect(20, 20, W - 40, H - 40);
    x.fillStyle = "#e9ba4a"; x.font = `700 19px ${F}`; x.fillText("✦ MIND THE ART GAP · " + T.brand, 60, 75);
    x.fillStyle = "#fff8e9"; x.font = `700 40px ${S}`; x.fillText(T.png, 60, 130);
    x.fillStyle = "#d9e0ed"; x.font = `22px ${F}`; x.fillText(result.nick ? `Επιβάτης: ${result.nick}` : "Επιβάτης: ανώνυμος/η", 60, 168);
    x.fillStyle = "#fff8e9"; x.font = `700 26px ${F}`; x.fillText(L.lean, 60, 225);
    x.fillStyle = "#f3c34e"; x.font = `italic 22px ${F}`; x.fillText("«" + (END ? L.qEnd : L.q) + "»", 60, 262);
    const lx = 60, lw = 880, ly = 330;
    const lg = x.createLinearGradient(lx, 0, lx + lw, 0); lg.addColorStop(0, "#ff8a7a"); lg.addColorStop(.5, "#5fd3a8"); lg.addColorStop(1, "#7db8ff");
    x.fillStyle = lg; x.fillRect(lx, ly - 7, lw, 14);
    if (oldAnswers) { const op = lx + lw * compute(oldAnswers).pos / 100; x.fillStyle = "#fff8e9"; x.globalAlpha = .55; x.beginPath(); x.arc(op, ly, 17, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1; x.setLineDash([5, 4]); x.lineWidth = 4; x.strokeStyle = "#102653"; x.stroke(); x.setLineDash([]); }
    const tx = lx + lw * result.pos / 100;
    x.fillStyle = "#fff8e9"; x.beginPath(); x.arc(tx, ly, 20, 0, Math.PI * 2); x.fill(); x.lineWidth = 5; x.strokeStyle = "#102653"; x.stroke();
    x.font = `700 17px ${F}`; x.fillStyle = "#ff8a7a"; x.fillText("Φόβος", lx, ly + 42);
    x.fillStyle = "#5fd3a8"; x.textAlign = "center"; x.fillText("Κριτική σκέψη", lx + lw / 2, ly + 42);
    x.fillStyle = "#7db8ff"; x.textAlign = "right"; x.fillText("Τυφλή εμπιστοσύνη", lx + lw, ly + 42); x.textAlign = "left";
    BARS.forEach(([k, n, col], j) => {
      const y = 420 + j * 44;
      x.fillStyle = "#f6e8c4"; x.font = `18px ${F}`; x.fillText(n.replace(/^\S+\s/, ""), 60, y + 6);
      x.fillStyle = "#28446c"; x.fillRect(260, y - 6, 480, 14);
      x.fillStyle = col; x.fillRect(260, y - 6, 480 * result[k], 14);
      x.fillStyle = "#fff8e9"; x.textAlign = "right"; x.fillText(Math.round(result[k] * 100) + "%", 800, y + 6); x.textAlign = "left";
    });
    x.textAlign = "right"; x.fillStyle = "#e9ba4a"; x.font = `700 14px ${F}`; x.fillText(T.codeLabel, 940, 440);
    x.fillStyle = "#fff8e9"; x.font = `700 40px ui-monospace, Consolas, monospace`; x.fillText(result.code, 940, 485);
    x.fillStyle = "#d9e0ed"; x.font = `18px ui-monospace, Consolas, monospace`; x.fillText(result.date, 940, 515); x.textAlign = "left";
    x.fillStyle = "#e9ba4a"; x.font = `700 16px ${F}`; x.fillText("Χωρίς φόβο · χωρίς τυφλή εμπιστοσύνη · Προσοχή στο κενό!", 60, 592);
    c.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = "MIND_THE_ART_GAP_eisitirio_" + (END ? "epilogos_" : "afetiria_") + result.code + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  }

  $("go").addEventListener("click", () => {
    oldAnswers = null; $("code-err").textContent = "";
    if (END) {
      const raw = $("oldcode").value.trim();
      if (raw) {
        oldAnswers = decode(raw);
        if (!oldAnswers) { $("code-err").textContent = "Ο κωδικός δεν αναγνωρίζεται. Έλεγξέ τον (4 χαρακτήρες, παύλα, 1 χαρακτήρας) ή άφησε το πεδίο κενό."; $("oldcode").focus(); return; }
      }
    }
    answers = new Array(Q.length).fill(null); i = 0; show("s-q"); renderQ();
  });
  $("next").addEventListener("click", () => { clearTimeout(timer); goNext(); });
  $("back").addEventListener("click", () => { clearTimeout(timer); if (i > 0) { i--; renderQ(); } else { show("s-start"); $("t-start").focus(); } });
  $("again").addEventListener("click", () => { show("s-start"); $("t-start").focus(); });
  $("dl").addEventListener("click", downloadTicket);
  $("print").addEventListener("click", () => window.print());

  document.addEventListener("keydown", e => {
    if ($("s-q").hidden || (e.target.tagName === "INPUT" && e.target.type === "text")) return;
    const n = Number(e.key);
    if (n >= 1 && n <= 5) pick(n - 1);
    else if (e.key === "Enter" && !$("next").disabled && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); clearTimeout(timer); goNext(); }
  });
})();
</script>
</body>
</html>
