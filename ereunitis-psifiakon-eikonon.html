<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ερευνητής ψηφιακών εικόνων</title>
<style>
:root{
  --bg:#FFF6DE;--panel:#FFFDF6;--ink:#14213D;--muted:#5E5B4C;--line:#0A7F99;--sun:#FFC93C;--earth:#8C500A;
  --rule:#E6DABA;--soft:#F4E8C6;--track:#EFE6CC;--ok:#2E7D4F;--okbg:#E2F1E7;--bad:#B23A2E;--badbg:#F8E2DE;
  --display:"Comfortaa","Trebuchet MS","Segoe UI",sans-serif;--body:"Ubuntu","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 16:9 stage — 1200×675 design, scaled to the iframe */
#stage{position:absolute;left:0;top:0;width:1200px;height:675px;transform-origin:0 0;
  display:flex;flex-direction:column;gap:10px;padding:16px 24px 14px;overflow:hidden;background:var(--bg)}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex:none}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--line);line-height:1.2}
h1{font-family:var(--display);font-size:24px;line-height:1.15;margin:2px 0 0;font-weight:700}
h2{font-family:var(--display);font-size:17px;line-height:1.2;margin:0;font-weight:700}
h3{font-family:var(--display);font-size:14.5px;line-height:1.25;margin:0;font-weight:700}
h2:focus,h3:focus{outline:none}
.lede{color:var(--muted);font-size:14px}
.small{font-size:12.5px;color:var(--muted)}
.credit{font-size:11px;color:var(--muted)}

/* panels & buttons */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.btn,.ghost{font-weight:700;border-radius:10px;border:2px solid transparent;padding:8px 16px;min-height:40px;cursor:pointer;line-height:1.2}
.btn{background:var(--ink);color:#fff}
.btn:hover{filter:brightness(1.25)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ghost{background:transparent;border-color:var(--rule);color:var(--ink)}
.ghost:hover{background:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:space-between}
.note{background:var(--soft);border-radius:10px;padding:9px 12px;font-size:13.5px}
.question{font-family:var(--display);font-size:15.5px;font-weight:700;background:var(--soft);border-left:5px solid var(--earth);padding:9px 12px;border-radius:0 10px 10px 0}
.verdict{background:var(--badbg);color:#6d2219;border-radius:10px;padding:11px 13px;font-size:14px}
.verdict.ok{background:var(--okbg);color:#1d4f33}
.verdict strong{display:block;font-family:var(--display);font-size:16px;margin-bottom:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted)}
.track{height:16px;background:var(--track);border-radius:8px;overflow:hidden}
.fill{height:100%;border-radius:8px;transition:width .6s ease,background .6s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--marker:#F2C230;--marker-ink:#231C02;--bubble:#DDF1E1;--chat:#E4E8E1;--dark:#0d0f12}
h1{font-size:21px}
/* case tabs */
.cases{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:none}
.case-btn{display:grid;grid-template-columns:46px 1fr;gap:0 7px;align-items:center;width:158px;height:50px;text-align:left;background:var(--panel);border:1.5px solid var(--rule);border-radius:10px;padding:4px 6px 4px 4px;cursor:pointer;position:relative}
.case-btn img{display:block;width:46px;height:36px;object-fit:cover;border-radius:6px}
.case-btn .t{display:block;font-weight:700;font-size:11px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-btn .s{display:block;font-size:10.5px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-btn .s.hit{color:var(--ok)} .case-btn .s.miss{color:var(--earth)}
.case-btn[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.case-btn .tent{position:absolute;left:4px;top:4px}
.tent{display:inline-grid;place-items:center;width:22px;height:19px;padding-top:3px;background:var(--marker);color:var(--marker-ink);font-weight:800;font-size:11px;line-height:1;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);filter:drop-shadow(0 1px 2px #0008)}

/* desk */
.desk{display:grid;grid-template-columns:600px 1fr;grid-template-rows:minmax(0,1fr);gap:14px;flex:1;min-height:0}
.evidence{position:relative;min-height:0}
#post{height:100%;min-height:0}
.hd>div:first-child{flex:1;min-width:0}
.hd h1{white-space:nowrap}
.post{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;height:100%}
.post-head{display:flex;gap:9px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);min-height:50px}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:hsl(var(--h) 42% 40%)}
.who{flex:1;min-width:0;line-height:1.25}
.who .name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px}
.who .name svg{flex:none}
.who .line{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.platform{flex:none;font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:2px 8px;white-space:nowrap}
.caption{margin:0;padding:7px 12px;font-size:13.5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.post.chat{background:var(--chat)}
.post.chat .post-head{background:#fff}
.post.chat .caption{margin:6px 12px 0;background:var(--bubble);border-radius:4px 12px 12px 12px;padding:6px 10px}
.fwd{display:flex;align-items:center;gap:5px;margin:6px 12px 0;font-size:11.5px;font-style:italic;color:var(--muted)}
.fwd b{font-style:normal;color:var(--ok)}
.ev{position:relative;flex:1;min-height:0;background:var(--dark);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.imgbox{position:relative;line-height:0}
.imgbox img{display:block;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:6px;cursor:pointer;line-height:1;touch-action:manipulation}
.mk .tent{width:32px;height:28px;font-size:14px}
.mk.seen .tent{background:#FFF1B8}
.mk.active .tent{background:#fff}
.mk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--marker);opacity:0;pointer-events:none}
.mk.pulse::after{animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
.mk:focus-visible{outline:3px solid #fff;outline-offset:1px;border-radius:8px}
.loupe{position:absolute;z-index:5;width:280px;background:#fff;color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 12px 32px #0008;line-height:1.4}
.loupe .zoom{width:100%;height:168px;background-repeat:no-repeat;background-color:var(--dark);border-bottom:4px solid var(--marker)}
.loupe .body{padding:8px 12px 10px;font-size:12.5px}
.loupe .body b{display:block;font-size:13px;margin-bottom:2px}
.loupe .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:#0a0c10b8;color:#fff;font-size:18px;line-height:1;cursor:pointer}
.combar{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--rule);background:#fff;border:0;border-top:1px solid var(--rule);width:100%;text-align:left;cursor:pointer;font-size:12.5px;min-height:38px}
.combar:hover{background:var(--soft)}
.combar .pv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.combar .pv b{color:var(--ink);margin-right:4px}
.combar .cnt{flex:none;font-weight:700;color:var(--line)}

/* drawer over the evidence */
.drawer{position:absolute;inset:0;z-index:8;background:#FFFDF6F2;backdrop-filter:blur(2px);border-radius:12px;border:1px solid var(--rule);padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.drawer h3{font-size:16px;padding-right:36px}
.drawer .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.drawer .sum{font-size:13.5px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font-size:13px}
.res img{width:96px;height:64px;object-fit:cover;border-radius:6px;display:block}
.res .ico{width:36px;height:36px;border-radius:8px;background:var(--soft);display:grid;place-items:center}
.res b{display:block}
.res span{display:block;font-size:12.5px;color:var(--muted)}
.exif{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12.5px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:2px 0 4px;padding:9px 11px;background:var(--soft);border-radius:8px}
.exif dt{color:var(--muted)} .exif dd{margin:0;overflow-wrap:anywhere}
.comment{font-size:13px;padding:6px 0;border-top:1px solid var(--rule)}
.comment b{margin-right:5px}
.comment.hid{background:#FFF6DE;margin:0 -6px;padding:6px;border-radius:6px}
.srcline{font-size:13.5px;padding:5px 0;border-top:1px solid var(--rule)}

/* desk right */
.deskr{display:flex;flex-direction:column;gap:9px;min-height:0}
.tools{display:flex;gap:8px}
.tool{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1.5px solid var(--rule);border-radius:9px;padding:7px 8px;font-weight:700;font-size:13px;cursor:pointer;min-height:38px}
.tool:hover{border-color:var(--ink)}
.tool.used{border-color:var(--ok);background:var(--okbg)}
.tool .tick{display:none;color:var(--ok)} .tool.used .tick{display:inline}
.meter{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px 12px}
.meter .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700}
.meter .lab b{font-family:var(--display);font-size:16px;color:var(--earth)}
.segs{display:flex;gap:4px;margin:6px 0 4px}
.segs i{flex:1;height:9px;border-radius:4px;background:var(--track)}
.segs i.on{background:var(--ok)}
.segs i.half{background:linear-gradient(90deg,var(--ok) 50%,var(--track) 50%)}
.meter .miss{font-size:11.5px;color:var(--muted);line-height:1.3;min-height:1.3em}
.check{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:11px 13px}
.check .hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:5px}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);background:#fff;font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.dot.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.dot.right{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.q{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.q .text{font-weight:700;font-size:15.5px;line-height:1.35}
.q .where{font-size:13.5px;color:var(--muted);line-height:1.4}
.ans{display:flex;gap:8px;align-items:center}
.ans button{min-width:74px;padding:6px 14px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:700;cursor:pointer}
.ans button:hover:not(:disabled){background:var(--soft)}
.ans button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ans button:disabled{cursor:default}
.ans button:disabled:not([aria-pressed="true"]){opacity:.35}
.ans .nav{margin-left:auto;display:flex;gap:4px}
.ans .nav button{min-width:34px;padding:6px 8px;border-color:var(--rule)}
.fb{font-size:14px;line-height:1.45;background:#fff;border-radius:8px;padding:8px 10px}
.fb .v{font-weight:700;margin-right:4px}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.q.right .fb .v{color:var(--ok)} .q.wrong .fb .v{color:var(--bad)}
.vbox{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.vbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vbtn{text-align:left;padding:7px 9px;border-radius:9px;border:1.5px solid var(--rule);background:#fff;font-weight:700;font-size:12.5px;line-height:1.25;cursor:pointer}
.vbtn:hover{border-color:var(--ink)}
.vbtn small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.waiting{font-size:12.5px;color:var(--muted)}
.reveal{flex:1;min-height:0;overflow:auto;border-radius:10px;padding:11px 13px;border-left:6px solid var(--ok);background:var(--soft);display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.reveal.miss{border-left-color:var(--earth)}
.reveal h3{font-size:16px}
.reveal .done{background:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px}
.reveal .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.reveal .acts .btn,.reveal .acts .ghost{min-height:36px;padding:6px 12px;font-size:13.5px}

/* summary overlay */
.summary{position:absolute;inset:0;z-index:20;background:var(--bg);padding:18px 26px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.summary h2{font-size:22px}
.summary .big{font-size:15px}
.summary .big b{font-family:var(--display);font-size:20px;color:var(--earth)}
.sumgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;flex:1;min-height:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12px}
.tbl .hit{color:var(--ok);font-weight:700} .tbl .miss{color:var(--earth);font-weight:700}
.keep{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.keep ol{margin:0;padding-left:1.2rem;display:grid;gap:8px}
.bigtrack{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.bigtrack div{height:100%;background:var(--ok);border-radius:7px;transition:width 1s ease}
</style>
</head>
<body>
<div id="stage">
  <header class="hd">
    <div>
      <div class="eyebrow">Deepfake &amp; παραπληροφόρηση</div>
      <h1>Ερευνητής ψηφιακών εικόνων</h1>
    </div>
    <nav aria-label="Υποθέσεις"><ol class="cases" id="cases"></ol></nav>
  </header>

  <main class="desk">
    <section class="evidence" aria-labelledby="ev-h">
      <h2 id="ev-h" class="sr">Το τεκμήριο</h2>
      <div id="post"></div>
      <div class="drawer" id="drawer" hidden role="dialog" aria-labelledby="dr-h"></div>
    </section>

    <section class="deskr" aria-labelledby="ck-h">
      <div class="tools" role="group" aria-label="Εργαλεία έρευνας">
        <button class="tool" id="t-src" type="button">👤 Πηγή <span class="tick" aria-hidden="true">✓</span></button>
        <button class="tool" id="t-rev" type="button">🔎 Αντίστροφη αναζήτηση <span class="tick" aria-hidden="true">✓</span></button>
        <button class="tool" id="t-meta" type="button">🗂️ Μεταδεδομένα <span class="tick" aria-hidden="true">✓</span></button>
      </div>
      <div class="meter" aria-live="polite">
        <div class="lab"><span>Πόσο ολοκληρωμένα διερεύνησες την εικόνα;</span><b id="m-n">0/6</b></div>
        <div class="segs" id="segs" aria-hidden="true"></div>
        <div class="miss" id="m-miss"></div>
      </div>
      <div class="check" id="check">
        <div class="hdr"><h2 id="ck-h">Λίστα ελέγχου <span class="small" style="font-weight:400">· «Ναι» = προειδοποιητικό σημάδι</span></h2><div class="dots" id="dots"></div></div>
        <div id="qbox"></div>
        <div class="vbox" id="verdict"></div>
      </div>
    </section>
  </main>

  <section class="summary" id="summary" hidden aria-labelledby="sum-h" tabindex="-1"></section>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
/* Προσαρμογή της σκηνής 1200×675 στο παράθυρο (iframe) */
(function(){
  const W=1200,H=675,st=document.getElementById('stage');
  function fit(){
    const s=Math.min(innerWidth/W,innerHeight/H);
    st.style.transform='scale('+s+')';
    st.style.left=Math.max(0,(innerWidth-W*s)/2)+'px';
    st.style.top=Math.max(0,(innerHeight-H*s)/2)+'px';
  }
  addEventListener('resize',fit); fit();
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- κατάσταση ---------- */
function blank(){return {cur:0,c:CASES.map(()=>({a:[null,null,null,null,null],v:null,seen:[],src:false,rev:false,meta:false,com:false,q:0,list:false}))};}
let state=blank();
const cs=()=>state.c[state.cur], cc=()=>CASES[state.cur];
const answeredOf=i=>state.c[i].a.filter(x=>x!==null).length;
const allDone=()=>state.c.every(x=>x.v);
function steps(i){const s=state.c[i],c=CASES[i];return [s.seen.length>=c.markers.length?1:(s.seen.length?0.5:0),+s.src,+s.rev,+s.meta,+s.com,s.v?1:0];}
const scoreOf=i=>steps(i).filter(v=>v===1).length;

/* ---------- καρτέλες υποθέσεων ---------- */
function renderTabs(){
  $('cases').innerHTML=CASES.map((c,i)=>{const st=state.c[i];let status='Δεν ελέγχθηκε',cls='';
    if(st.v){status='✓ πόρισμα · '+scoreOf(i)+'/6';cls=scoreOf(i)===6?'hit':'miss';}
    else if(answeredOf(i)||st.seen.length||st.src||st.rev||st.meta||st.com){status='έρευνα '+scoreOf(i)+'/6';}
    return `<li><button class="case-btn" type="button" data-i="${i}"${i===state.cur?' aria-current="true"':''}><img src="${IMG[c.img]}" alt=""><span class="tent" aria-hidden="true">${i+1}</span><span><span class="t">${esc(c.title)}</span><span class="s ${cls}">${esc(status)}</span></span></button></li>`;}).join('');
}

  const marks=c.markers.map((m,k)=>`<button class="mk${st.seen.includes(k)?' seen':' pulse'}" type="button" style="left:${m.x*100}%;top:${m.y*100}%" data-k="${k}" aria-label="Σημάδι ${k+1}: ${esc(m.title)}"><span class="tent">${k+1}</span></button>`).join('');
  const ev=`<div class="ev" id="ev"><div class="imgbox" id="imgbox"><img id="evimg" src="${IMG[c.img]}" alt="${esc(c.alt)}">${marks}</div><div class="loupe" id="loupe" hidden role="dialog" aria-label="Μεγέθυνση"></div></div>`;
  const n=c.comments.length+(c.hidden?c.hidden.length:0);
  const first=c.comments[0];
  const bar=`<button class="combar" type="button" id="combar" aria-label="Διάβασε τα ${n} σχόλια"><span aria-hidden="true">💬</span><span class="pv"><b>${esc(first[0])}</b>${esc(first[1])}</span><span class="cnt">${n} ${c.kind==='chat'?'μηνύματα':'σχόλια'} ›</span></button>`;
  if(c.kind==='chat')return `<article class="post chat">${head}<div class="fwd"><b>${esc(c.sender)}</b> · ↪ ${esc(c.forwarded)}</div><p class="caption">${esc(c.caption)}</p>${ev}${bar}</article>`;
  return `<article class="post">${head}<p class="caption">${esc(c.caption)}</p>${ev}${bar}</article>`;
}

/* ---------- φακός ---------- */
let openK=null;
function openMarker(k){
  const c=cc(),m=c.markers[k],st=cs();
  const box=$('imgbox'),ev=$('ev'),img=$('evimg'),lp=$('loupe');
  const W=box.clientWidth,H=box.clientHeight,EW=ev.clientWidth,EH=ev.clientHeight,off=box.offsetLeft;
  lp.innerHTML=`<div class="zoom" role="img" aria-label="Μεγέθυνση της περιοχής: ${esc(m.title)}"></div><div class="body"><b>${k+1}. ${esc(m.title)}</b>${esc(m.text)}</div><button class="x" type="button" aria-label="Κλείσιμο μεγέθυνσης">×</button>`;
  lp.hidden=false;
  const lw=280,zh=168,z=m.zoom||3,bw=W*z,bh=H*z;
  let px=lw/2-m.zx*bw,py=zh/2-m.zy*bh;
  px=Math.min(0,Math.max(lw-bw,px));py=Math.min(0,Math.max(zh-bh,py));
  const zoom=lp.querySelector('.zoom');
  zoom.style.backgroundImage=`url("${img.src}")`;zoom.style.backgroundSize=bw+'px '+bh+'px';zoom.style.backgroundPosition=px+'px '+py+'px';
  const mx=off+m.x*W;
  if(mx<EW/2){lp.style.left=Math.min(EW-lw-8,mx+30)+'px';}else{lp.style.left=Math.max(8,mx-30-lw)+'px';}
  const lh=lp.offsetHeight;let top=m.y*H-lh/2;top=Math.max(6,Math.min(EH-lh-6,top));if(lh>EH-12)top=6;
  lp.style.top=top+'px';
  document.querySelectorAll('.mk').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector(`.mk[data-k="${k}"]`);btn.classList.add('active','seen');btn.classList.remove('pulse');
  if(!st.seen.includes(k)){st.seen.push(k);renderMeter();renderTabs();}
  openK=k;
  lp.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();closeLoupe(true);});
}

    h=`<h3 id="dr-h">🗂️ Μεταδεδομένα αρχείου (EXIF)</h3><dl class="exif">${c.meta.rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="sum">${esc(c.meta.note)}</p>`;}
  if(kind==='com'){st.com=true;const chat=c.kind==='chat';
    h=`<h3 id="dr-h">💬 ${chat?'Όλα τα μηνύματα της ομάδας':'Όλα τα σχόλια'}</h3>`+
      c.comments.map(([w,t])=>`<p class="comment"><b>${esc(w)}</b>${esc(t)}</p>`).join('')+
      (c.hidden&&c.hidden.length?`<p class="small">Παλαιότερα ${chat?'μηνύματα':'σχόλια'} που δεν φαίνονταν με την πρώτη ματιά:</p>`+c.hidden.map(([w,t])=>`<p class="comment hid"><b>${esc(w)}</b>${esc(t)}</p>`).join(''):`<p class="small">Δεν υπάρχουν άλλα ${chat?'μηνύματα':'σχόλια'}.</p>`);}
  d.innerHTML=h+'<button class="x" type="button" aria-label="Κλείσιμο">×</button>';d.hidden=false;
  d.querySelector('.x').focus({preventScroll:true});
  closeLoupe(false);renderTools();renderMeter();renderTabs();
}
function closeDrawer(){$('drawer').hidden=true;}
function renderTools(){const st=cs();[['src','t-src'],['rev','t-rev'],['meta','t-meta']].forEach(([k,id])=>$(id).classList.toggle('used',!!st[k]));}

/* ---------- μετρητής πληρότητας ---------- */
function renderMeter(){
  const sv=steps(state.cur),n=sv.filter(v=>v===1).length,st=cs(),c=cc();
  $('m-n').textContent=n+'/6';
  $('segs').innerHTML=sv.map((v,i)=>`<i class="${v===1?'on':v===0.5?'half':''}" title="${STEPS[i]}"></i>`).join('');
  const miss=[];
  if(sv[0]!==1)miss.push(`σημάδια (${st.seen.length}/${c.markers.length})`);
  if(!st.src)miss.push('πηγή');if(!st.rev)miss.push('αντίστροφη αναζήτηση');if(!st.meta)miss.push('μεταδεδομένα');if(!st.com)miss.push('σχόλια');
  if(!st.v)miss.push(answeredOf(state.cur)<5?`λίστα ελέγχου (${answeredOf(state.cur)}/5)`:'πόρισμα');
  $('m-miss').textContent=miss.length?'Μένουν: '+miss.join(' · '):'Πλήρης έρευνα. Μπράβο!';
}

/* ---------- λίστα ελέγχου (μία ερώτηση τη φορά) ---------- */
function renderDots(){const st=cs(),c=cc();
  $('dots').innerHTML=Q.map((_,j)=>{const a=st.a[j];const cls=a===null?'':(a===c.answers[j]?'right':'wrong');
    return `<button class="dot ${cls}${j===st.q?' cur':''}" type="button" data-j="${j}" aria-label="Ερώτηση ${j+1}${a===null?'':a===c.answers[j]?', σωστή':', λάθος'}">${j+1}</button>`;}).join('');}
function renderQ(){
  const st=cs(),c=cc(),j=st.q,a=st.a[j],done=a!==null,ok=done&&a===c.answers[j];
  const btn=(val,label)=>`<button type="button" data-v="${val}" aria-pressed="${done&&a===val}"${done?' disabled':''}>${label}</button>`;
  $('qbox').innerHTML=`<div class="q${done?(ok?' right':' wrong'):''}" id="q">
    <span class="text">${j+1}. ${esc(Q[j].text)}</span><span class="where">${esc(Q[j].where)}</span>
    <div class="ans" role="group" aria-label="Απάντηση στην ερώτηση ${j+1}">${btn(true,'Ναι')}${btn(false,'Όχι')}
      <span class="nav"><button type="button" id="prev" aria-label="Προηγούμενη ερώτηση"${j===0?' disabled':''}>‹</button><button type="button" id="next" aria-label="Επόμενη ερώτηση"${j===4?' disabled':''}>›</button></span></div>
    ${done?`<p class="fb" tabindex="-1" id="fb"><span class="v">${ok?RIGHT[j]:WRONG[j]}</span>${esc(c.explain[j])}</p>`:''}</div>`;
  renderDots();
}
function answer(val){const st=cs(),j=st.q;if(st.a[j]!==null)return;st.a[j]=val;renderQ();const fb=$('fb');if(fb)fb.focus({preventScroll:true});renderVerdict();renderMeter();renderTabs();}
function goQ(j){cs().q=j;renderQ();}

/* ---------- πόρισμα ---------- */
function nextUnfinished(){for(let d=1;d<=CASES.length;d++){const i=(state.cur+d)%CASES.length;if(!state.c[i].v)return i;}return -1;}
function renderVerdict(){
  const st=cs(),n=answeredOf(state.cur),box=$('verdict');
  if(n<5){box.innerHTML=`<p class="waiting">Απάντησε και στις 5 ερωτήσεις για να βγάλεις πόρισμα (${n} από 5).</p>`;return;}
  if(!st.v){box.innerHTML=`<h3>Τι είναι τελικά αυτή η εικόνα;</h3><div class="vbtns">${Object.entries(VERDICTS).map(([k,v])=>`<button class="vbtn" type="button" data-verdict="${k}">${esc(v.label)}<small>${esc(v.hint)}</small></button>`).join('')}</div>`;return;}
  box.innerHTML='';
}
function renderCheck(){
  const st=cs(),c=cc();
  if(st.v&&!st.list){
    const ok=st.v===c.verdict,sc=scoreOf(state.cur),nxt=nextUnfinished(),sv=steps(state.cur);
    const missing=STEPS.filter((_,i)=>sv[i]!==1&&i<5);
    $('check').innerHTML=`<div class="reveal ${ok?'':'miss'}" id="reveal" tabindex="-1">
      <h3>${ok?'Το πόρισμά σου συμφωνεί με τα στοιχεία.':'Τα στοιχεία δείχνουν κάτι άλλο.'}</h3>
      <p>Η εικόνα ήταν: <b>${esc(VERDICTS[c.verdict].label)}</b>${ok?'':` (εσύ διάλεξες: ${esc(VERDICTS[st.v].label)})`}. ${esc(c.summary)}</p>
      <p><b>Τι κρατάμε:</b> ${esc(c.lesson)}</p>
      <p class="done"><b>Πόσο ολοκληρωμένα διερεύνησες την εικόνα; ${sc}/6.</b> ${sc===6?'Χρησιμοποίησες όλα τα εργαλεία του ερευνητή.':'Δεν έλεγξες: '+missing.join(', ')+'. Τα εργαλεία μένουν ανοιχτά — μπορείς να το κάνεις τώρα.'}</p>
      <div class="acts">${nxt>=0?`<button class="btn" type="button" data-go="${nxt}">Υπόθεση ${nxt+1}: ${esc(CASES[nxt].title)} →</button>`:`<button class="btn" type="button" id="to-summary">Δες τη σύνοψη</button>`}<button class="ghost" type="button" id="show-list">Ξαναδές τη λίστα ελέγχου</button></div></div>`;
    return;
  }
  $('check').innerHTML=`<div class="hdr"><h2 id="ck-h">Λίστα ελέγχου <span class="small" style="font-weight:400">· «Ναι» = προειδοποιητικό σημάδι</span></h2><div class="dots" id="dots"></div></div><div id="qbox"></div><div class="vbox" id="verdict"></div>${st.v?'<div class="row" style="justify-content:flex-end"><button class="ghost" type="button" id="hide-list" style="min-height:34px;padding:5px 12px;font-size:13px">← Πίσω στο πόρισμα</button></div>':''}`;
  renderQ();renderVerdict();
}

/* ---------- σύνοψη ---------- */
function renderSummary(){
  const box=$('summary');if(!allDone()){box.hidden=true;return;}
  const total=CASES.reduce((n,_,i)=>n+scoreOf(i),0),agree=CASES.reduce((n,c,i)=>n+(state.c[i].v===c.verdict?1:0),0);
  box.innerHTML=`<h2 id="sum-h">Η έρευνα ολοκληρώθηκε</h2>
    <p class="big">Πόσο ολοκληρωμένα διερεύνησες τις 5 εικόνες; <b>${total} / 30</b> βήματα έρευνας. Πορίσματα που συμφώνησαν με τα στοιχεία: <b>${agree} / 5</b>.</p>
    <div class="bigtrack"><div style="width:0" id="bigfill"></div></div>
    <div class="sumgrid"><div><table class="tbl"><thead><tr><th>Υπόθεση</th><th>Η εικόνα ήταν</th><th>Το πόρισμά σου</th><th>Έρευνα</th></tr></thead><tbody>
    ${CASES.map((c,i)=>{const ok=state.c[i].v===c.verdict;return `<tr><td>${i+1}. ${esc(c.title)}</td><td>${esc(VERDICTS[c.verdict].label)}</td><td class="${ok?'hit':'miss'}">${ok?'Συμφωνεί':esc(VERDICTS[state.c[i].v].label)}</td><td>${scoreOf(i)}/6</td></tr>`;}).join('')}
    </tbody></table>
    <p class="credit" style="margin-top:10px">Οι εικόνες 1 και 3 δημιουργήθηκαν με ΤΝ στο Canva για αυτή τη δραστηριότητα. Η εικόνα 4 είναι σύνθεση δύο εικόνων ΤΝ του Canva (πρόσωπο από τη μία, σώμα από την άλλη). Οι εικόνες 2 και 5 είναι αληθινές φωτογραφίες κοινού κτήματος: ο πύραυλος της αποστολής DSCOVR στην εξέδρα (SpaceX, 2015) και το επίσημο πορτρέτο της αστροναύτισσας Eileen Collins (NASA). Οι αναρτήσεις, οι λογαριασμοί, τα μεταδεδομένα και τα αποτελέσματα αναζήτησης είναι φανταστικά.</p></div>
    <div class="keep"><h3>Τι κρατάμε</h3><ol>
      <li>Καμία λίστα ελέγχου δεν «αποδεικνύει» αν μια εικόνα είναι αληθινή. Αξιολογούμε πόσο καλά ερευνήσαμε.</li>
      <li>Ψάξε λάθη στα χέρια, στα γράμματα, στο φως και στις άκρες, όχι μόνο στο πρόσωπο.</li>
      <li>Έλεγξε ποιος δημοσίευσε την εικόνα και αν τη βρίσκεις σε αξιόπιστες πηγές με αντίστροφη αναζήτηση.</li>
      <li>Η απουσία σήμανσης ή μεταδεδομένων δεν αποδεικνύει ότι μια εικόνα είναι αληθινή.</li>
      <li>Όταν μια ανάρτηση σε θυμώνει ή σε τρομάζει, σταμάτα πριν την κοινοποιήσεις.</li></ol>
      <div class="row" style="margin-top:auto"><button class="btn" type="button" id="reset">Ξεκίνα από την αρχή</button><button class="ghost" type="button" id="close-sum">Κλείσε</button></div></div></div>`;
  box.hidden=false;box.focus({preventScroll:true});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('bigfill').style.width=(total/30*100)+'%';}));
}

/* ---------- απόδοση υπόθεσης ---------- */
function layoutImg(){
  const ev=$('ev'),box=$('imgbox');if(!ev||!box)return;
  const c=cc(),r=c.w/c.h,EW=ev.clientWidth-6,EH=ev.clientHeight-6;
  let h=EH,w=EH*r;if(w>EW){w=EW;h=EW/r;}
  box.style.width=Math.floor(w)+'px';box.style.height=Math.floor(h)+'px';
}
function renderCase(){
  const c=cc(),st=cs();openK=null;closeDrawer();
  $('post').innerHTML=postHTML(c,st);
  layoutImg();
  renderTools();renderMeter();renderCheck();renderTabs();
}
addEventListener('resize',layoutImg);
function go(i){state.cur=i;renderCase();}

/* ---------- συμβάντα ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const cb=t.closest('.case-btn');if(cb){go(Number(cb.dataset.i));return;}
  const mk=t.closest('.mk');if(mk){const k=Number(mk.dataset.k);if(openK===k)closeLoupe(false);else openMarker(k);return;}
  if(t.closest('#loupe'))return;
  if(t.closest('#ev')){closeLoupe(false);return;}
  if(t.closest('#combar')){openDrawer('com');return;}
  if(t.closest('#t-src')){openDrawer('src');return;}
  if(t.closest('#t-rev')){openDrawer('rev');return;}
  if(t.closest('#t-meta')){openDrawer('meta');return;}
  if(t.closest('#drawer .x')){closeDrawer();return;}
  const dot=t.closest('.dot');if(dot){goQ(Number(dot.dataset.j));return;}
  if(t.closest('#prev')){goQ(cs().q-1);return;}
  if(t.closest('#next')){goQ(cs().q+1);return;}
  const ab=t.closest('.ans button[data-v]');if(ab&&!ab.disabled){answer(ab.dataset.v==='true');return;}
  const vb=t.closest('.vbtn');if(vb){cs().v=vb.dataset.verdict;cs().list=false;renderCheck();renderMeter();renderTabs();const r=$('reveal');if(r)r.focus({preventScroll:true});$('live').textContent=r?r.textContent:'';return;}
  const nx=t.closest('[data-go]');if(nx){go(Number(nx.dataset.go));return;}
  if(t.closest('#to-summary')){renderSummary();return;}
  if(t.closest('#show-list')){cs().list=true;renderCheck();return;}
  if(t.closest('#hide-list')){cs().list=false;renderCheck();return;}
  if(t.closest('#close-sum')){$('summary').hidden=true;return;}
  if(t.closest('#reset')){state=blank();$('summary').hidden=true;go(0);return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLoupe(true);closeDrawer();}});
renderCase();
</script>
</body>
</html>
